<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Box Breathing</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #050505;
            --panel: rgba(14, 8, 0, 0.72);
            --panel-strong: rgba(22, 12, 0, 0.85);
            --border: rgba(255, 148, 53, 0.24);
            --glow: #f97316;
            --text: #ffedd5;
            --muted: #fcd34da6;
            --accent-1: #fb923c;
            --accent-2: #fcd34d;
            --success: #4ade80;
            --danger: #ff6b6b;
            --radius-lg: 22px;
            --radius-sm: 12px;
            --shadow: 0 14px 40px rgba(0, 0, 0, 0.55), 0 0 120px rgba(249, 115, 22, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 20% 20%, rgba(249, 115, 22, 0.16), transparent 28%),
                        radial-gradient(circle at 80% 10%, rgba(252, 211, 77, 0.18), transparent 30%),
                        radial-gradient(circle at 70% 80%, rgba(248, 113, 113, 0.12), transparent 34%),
                        var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Offline notification styles */
        #offline-notification {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #92400e;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            z-index: 1000;
            display: none;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem 1.25rem 2.5rem;
            width: 100%;
            box-sizing: border-box;
        }

        #box-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        #box-canvas.is-visible {
            opacity: 1;
        }

        #app-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: min(720px, 96vw);
            margin: 0 auto;
        }

        h1 {
            font-size: clamp(2.4rem, 6vw, 3.2rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0.35rem 0 0.5rem;
            color: var(--accent-2);
            text-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 24px rgba(252, 211, 77, 0.25);
        }

        .app-shell {
            width: 100%;
            background: linear-gradient(135deg, var(--panel), var(--panel-strong));
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            border-radius: var(--radius-lg);
            padding: clamp(1.4rem, 5vw, 2rem);
            backdrop-filter: blur(8px);
            position: relative;
            overflow: hidden;
        }

        .app-shell::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 20%, rgba(252, 211, 77, 0.08), transparent 55%),
                        radial-gradient(circle at 80% 15%, rgba(249, 115, 22, 0.08), transparent 55%),
                        radial-gradient(circle at 50% 80%, rgba(56, 189, 248, 0.07), transparent 55%);
            opacity: 0.8;
            pointer-events: none;
        }

        .app-shell > * {
            position: relative;
            z-index: 1;
        }

        .header {
            width: 100%;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .eyebrow {
            text-transform: uppercase;
            letter-spacing: 0.14em;
            font-size: 0.8rem;
            color: var(--muted);
            margin: 0;
        }

        .tagline {
            margin: 0;
            color: var(--text);
            opacity: 0.82;
            font-weight: 400;
            line-height: 1.5;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.8rem;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.22), rgba(252, 211, 77, 0.18));
            border: 1px solid rgba(252, 211, 77, 0.28);
            color: var(--accent-2);
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: inset 0 0 0 1px rgba(249, 115, 22, 0.25);
        }

        .timer {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0.85rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: var(--accent-2);
            font-weight: 600;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .highlight-card {
            width: 100%;
            background: linear-gradient(180deg, rgba(249, 115, 22, 0.12), rgba(0, 0, 0, 0.2));
            border: 1px solid var(--border);
            box-shadow: inset 0 0 0 1px rgba(249, 115, 22, 0.12);
            border-radius: var(--radius-sm);
            padding: 1rem 1.25rem;
            margin: 0 auto 1rem;
        }

        .instruction {
            font-size: 1.8rem;
            margin: 0.2rem 0 0.2rem;
            color: var(--accent-1);
            text-shadow: 0 10px 30px rgba(249, 115, 22, 0.18);
            text-align: center;
        }

        .countdown {
            font-size: clamp(3.2rem, 12vw, 4.8rem);
            font-weight: 700;
            margin: 0.15rem 0 0.2rem;
            color: var(--danger);
            letter-spacing: 0.04em;
            text-align: center;
        }

        .phase-tracker {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0.8rem;
            margin-top: 0.75rem;
            margin-bottom: 0.4rem;
            width: 100%;
        }

        .phase-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.35rem;
            opacity: 0.55;
            transform: translateY(0);
            transition: opacity 0.25s ease, transform 0.25s ease, border-color 0.25s ease;
            font-size: 0.95rem;
            color: #fde68a;
            padding: 0.65rem 0.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(255, 255, 255, 0.01);
        }

        .phase-item.active {
            opacity: 1;
            transform: translateY(-4px);
            color: var(--phase-color, #fde68a);
            border-color: rgba(249, 115, 22, 0.35);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
        }

        .phase-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--phase-color, #fde68a);
            background-color: var(--phase-soft, rgba(253, 230, 138, 0.25));
            box-shadow: 0 0 0 rgba(0, 0, 0, 0);
            transition: background-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
        }

        .phase-item.active .phase-dot {
            background: radial-gradient(circle, var(--phase-color, #fde68a) 0%, rgba(0, 0, 0, 0) 70%);
            box-shadow: 0 0 12px var(--phase-color, #fde68a);
            transform: scale(1.08);
        }

        .phase-label {
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .prompt {
            font-size: 1.1rem;
            margin: 0.4rem 0 1.1rem;
            color: var(--muted);
            text-align: center;
        }

        .complete {
            font-size: 1.7rem;
            margin: 0.6rem 0;
            color: var(--success);
            text-align: center;
        }

        .limit-warning {
            margin: 0.1rem 0 1rem;
            color: var(--accent-1);
            font-size: 0.95rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
        }

        .settings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 0.9rem;
            width: 100%;
            margin: 0 auto 0.6rem;
        }

        .card {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-sm);
            padding: 1rem 1.1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .form-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 0.35rem 0;
        }

        input[type="number"] {
            background-color: rgba(120, 53, 15, 0.6);
            color: var(--text);
            border: 1px solid rgba(217, 119, 6, 0.9);
            padding: 0.65rem 0.75rem;
            border-radius: 10px;
            font-size: 16px;
            width: 140px;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
        }

        label {
            color: #fde68a;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
        }

        button {
            font-size: 1.1rem;
            padding: 0.95rem 1.4rem;
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            color: black;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(249, 115, 22, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            width: 100%;
            max-width: 420px;
        }

        button:hover {
            background: linear-gradient(135deg, #fbbf24, #c2410c);
        }

        .button-row {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .ghost {
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent-2);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .ghost:hover {
            background: rgba(255, 255, 255, 0.09);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #374151;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #d97706;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .icon {
            display: inline-block;
            vertical-align: middle;
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .shortcut-buttons {
            display: flex;
            gap: 0.65rem;
            margin-top: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .preset-button {
            font-size: 0.95rem;
            padding: 0.55rem 1.05rem;
            background: rgba(146, 64, 14, 0.9);
            color: #ffedd5;
            border-radius: 12px;
            border: 1px solid rgba(249, 115, 22, 0.4);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
            width: auto;
            max-width: none;
        }

        .preset-button:hover {
            background-color: #78350f;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 0.3rem;
            margin-bottom: 1.2rem;
            gap: 0.4rem;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 240px;
            height: 12px;
            background: linear-gradient(90deg, rgba(217, 119, 6, 0.8), rgba(249, 115, 22, 0.9));
            border-radius: 999px;
            outline: none;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(249, 115, 22, 0.4);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #fcd34d, #f97316);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
        }

        input[type="range"]::-moz-range-track {
            width: 240px;
            height: 12px;
            background: linear-gradient(90deg, rgba(217, 119, 6, 0.8), rgba(249, 115, 22, 0.9));
            border-radius: 999px;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #fcd34d, #f97316);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2.15rem;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .phase-tracker {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 0.65rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            button,
            .slider,
            input[type="range"] {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- Offline notification div -->
    <div id="offline-notification" style="display: none;">You are offline, but the app will work normally</div>

    <div class="container">
        <div id="app-content"></div>
        <canvas id="box-canvas"></canvas>
    </div>

    <script src="app.js"></script>

    <script>
        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(error => {
                        console.log('ServiceWorker registration failed: ', error);
                    });
            });
        }
    </script>
</body>
</html>
